name: Upload novaplay.json to Supabase

on:
  push:
    paths:
      - "novaplay.json"

  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Requests
        run: pip install requests

      - name: Agregar número de canal
        run: |
          python << 'EOF'
          import json

          archivo = "novaplay.json"

          with open(archivo, "r", encoding="utf-8") as f:
              data = json.load(f)

          numero_canal = 1

          # Recorrer las categorías
          if isinstance(data, list):
              for categoria in data:

                  if not isinstance(categoria, dict):
                      continue

                  # Buscar los canales dentro de "items"
                  items = categoria.get("items")

                  if not isinstance(items, list):
                      continue

                  for canal in items:

                      if not isinstance(canal, dict):
                          continue

                      if "name" not in canal:
                          continue

                      # Crear el nuevo objeto poniendo "canal"
                      # justo antes de "name"
                      nuevo_canal = {}

                      for clave, valor in canal.items():

                          if clave == "name":
                              nuevo_canal["canal"] = str(numero_canal)

                          nuevo_canal[clave] = valor

                      # Reemplazar el canal original
                      canal.clear()
                      canal.update(nuevo_canal)

                      numero_canal += 1

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"✔ Se asignaron {numero_canal - 1} canales.")
          EOF

      - name: Mostrar JSON modificado
        run: cat novaplay.json

      - name: Subir novaplay.json a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests

          url = f"{os.environ['SUPABASE_URL']}/storage/v1/object/Novaplay/novaplay.json"

          headers = {
              "Authorization": f"Bearer {os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
              "apikey": os.environ['SUPABASE_SERVICE_ROLE_KEY'],
              "Content-Type": "application/json",
              "x-upsert": "true"
          }

          with open("novaplay.json", "rb") as f:
              r = requests.post(
                  url,
                  headers=headers,
                  data=f
              )

          print("Código:", r.status_code)
          print(r.text)

          r.raise_for_status()

          print("✔ novaplay.json subido correctamente a Supabase.")
          EOF
